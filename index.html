<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>봉사를 위한 준비</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7f6;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
      color: #222;
    }

    /* =========================
       상단
       ========================= */

    .header {
      background: #3f7f4a;
      color: white;
      padding: 18px 20px;
      font-size: 23px;
      font-weight: 700;
    }

    /* =========================
       전체 영역
       ========================= */

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 18px 12px 40px;
    }

    /* =========================
       24개 주제 버튼
       ========================= */

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .menu-button {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 62px;
      padding: 8px 4px;

      background: white;

      border: 1px solid #d5ded7;
      border-radius: 12px;

      color: #222;
      font-size: 17px;
      font-weight: 700;

      line-height: 1.25;
      text-align: center;
      text-decoration: none;

      box-shadow: 0 3px 7px rgba(0,0,0,0.10);

      cursor: pointer;

      transition: 0.1s;
    }

    .menu-button:hover {
      background: #f1f7f2;
    }

    .menu-button:active {
      transform: scale(0.96);
      background: #e8f3e9;
    }

    /* =========================
       주제 화면
       ========================= */

    #topicPage {
      display: none;
    }

    /* 홈으로 돌아가기 */

    .home-button {
      display: inline-block;

      margin-bottom: 18px;
      padding: 10px 15px;

      background: white;

      border: 1px solid #d5ded7;
      border-radius: 9px;

      color: #28733a;
      font-size: 15px;
      font-weight: 700;

      text-decoration: none;

      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }

    .home-button:active {
      transform: scale(0.97);
    }

    /* =========================
       주제 제목
       ========================= */

    .topic-title {
      margin-bottom: 18px;

      font-size: 27px;
      font-weight: 700;

      line-height: 1.3;
    }

    /* =========================
       자료 카드
       ========================= */

    .data-card {
      background: white;

      border-radius: 14px;

      padding: 20px;

      margin-bottom: 15px;

      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* =========================
       성구 영역
       ========================= */

    .bible-section {
      padding: 18px;

      background: #f7faf7;

      border-radius: 12px;

      border: 1px solid #e1ebe3;
    }

    .bible-label {
      font-size: 16px;
      font-weight: 700;

      color: #28733a;

      margin-bottom: 12px;
    }

    .bible-title {
      display: inline-block;

      color: #2f7040;

      font-size: 20px;
      font-weight: 700;

      text-decoration: none;

      margin-bottom: 12px;
    }

    .bible-title::after {
      content: " ↗";
      font-size: 16px;
    }

    .bible-title:active {
      opacity: 0.6;
    }

    .bible-text {
      font-size: 17px;

      line-height: 1.8;

      color: #333;
    }

    .bible-button {
      display: block;

      width: 100%;

      margin-top: 18px;

      padding: 14px 16px;

      border-radius: 10px;

      background: #3f7f4a;

      color: white;

      font-size: 17px;
      font-weight: 700;

      text-align: center;

      text-decoration: none;
    }

    .bible-button:active {
      transform: scale(0.98);
    }

    /* =========================
       자료가 없을 때
       ========================= */

    .empty-message {
      background: white;

      border-radius: 14px;

      padding: 25px 20px;

      color: #777;

      text-align: center;

      font-size: 16px;

      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* =========================
       휴대폰
       ========================= */

    @media (max-width: 480px) {

      .header {
        font-size: 21px;
        padding: 16px;
      }

      .container {
        padding: 14px 10px 30px;
      }

      .menu-grid {
        gap: 8px;
      }

      .menu-button {
        min-height: 58px;

        font-size: 15px;

        padding: 7px 3px;

        border-radius: 11px;
      }

      .topic-title {
        font-size: 24px;
        margin-bottom: 16px;
      }

      .data-card {
        padding: 17px;
      }

      .bible-section {
        padding: 16px;
      }

      .bible-title {
        font-size: 19px;
      }

      .bible-text {
        font-size: 16px;
        line-height: 1.75;
      }

      .bible-button {
        font-size: 17px;
        padding: 15px;
      }
    }

  </style>
</head>


<body>


  <!-- ==================================================
       상단
       ================================================== -->

  <div class="header">
    봉사를 위한 준비
  </div>


  <main class="container">


    <!-- ==================================================
         홈 화면
         ================================================== -->

    <section id="homePage">

      <div class="menu-grid">


        <!-- 1줄 -->

        <a href="#"
           class="menu-button"
           onclick="openTopic('대화[칭찬]'); return false;">
          대화[칭찬]
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('고난[시련]'); return false;">
          고난[시련]
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('미래[희망]'); return false;">
          미래[희망]
        </a>


        <!-- 2줄 -->

        <a href="#"
           class="menu-button"
           onclick="openTopic('이름[여호와]'); return false;">
          이름[여호와]
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('전파[전도]'); return false;">
          전파[전도]
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('예 언'); return false;">
          예 언
        </a>


        <!-- 3줄 -->

        <a href="#"
           class="menu-button"
           onclick="openTopic('생 일'); return false;">
          생 일
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('죽음[사망]'); return false;">
          죽음[사망]
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('부 활'); return false;">
          부 활
        </a>


        <!-- 4줄 -->

        <a href="#"
           class="menu-button"
           onclick="openTopic('지 옥'); return false;">
          지 옥
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('천국[천당]'); return false;">
          천국[천당]
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('왕 국'); return false;">
          왕 국
        </a>


        <!-- 5줄 -->

        <a href="#"
           class="menu-button"
           onclick="openTopic('정치[중립]'); return false;">
          정치[중립]
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('전 쟁'); return false;">
          전 쟁
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('통치자'); return false;">
          통치자
        </a>


        <!-- 6줄 -->

        <a href="#"
           class="menu-button"
           onclick="openTopic('크리스마스'); return false;">
          크리스마스
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('십자가'); return false;">
          십자가
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('삼위일체'); return false;">
          삼위일체
        </a>


        <!-- 7줄 -->

        <a href="#"
           class="menu-button"
           onclick="openTopic('과 학'); return false;">
          과 학
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('수 혈'); return false;">
          수 혈
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('계시록'); return false;">
          계시록
        </a>


        <!-- 8줄 -->

        <a href="#"
           class="menu-button"
           onclick="openTopic('동성애'); return false;">
          동성애
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('안식일'); return false;">
          안식일
        </a>

        <a href="#"
           class="menu-button"
           onclick="openTopic('편지봉사'); return false;">
          편지봉사
        </a>


      </div>

    </section>



    <!-- ==================================================
         주제 화면
         ================================================== -->

    <section id="topicPage">


      <!-- 홈으로 돌아가기 -->

      <a
        href="#"
        class="home-button"
        onclick="goHome(); return false;"
      >
        ← 홈으로 돌아가기
      </a>


      <!-- 선택한 주제 -->

      <div
        id="topicTitle"
        class="topic-title">
      </div>


      <!-- 자료가 표시되는 곳 -->

      <div id="topicData">
      </div>


    </section>


  </main>



  <script>

    /* ==========================================
       주제 열기
       ========================================== */

    function openTopic(topic) {

      document.getElementById("homePage").style.display = "none";

      document.getElementById("topicPage").style.display = "block";

      document.getElementById("topicTitle").textContent = topic;

      showTopicData(topic);

      window.scrollTo(0, 0);
    }



    /* ==========================================
       홈으로 돌아가기
       ========================================== */

    function goHome() {

      document.getElementById("topicPage").style.display = "none";

      document.getElementById("homePage").style.display = "block";

      window.scrollTo(0, 0);
    }



    /* ==========================================
       주제별 자료
       ========================================== */

    function showTopicData(topic) {

      const area = document.getElementById("topicData");


      /* ------------------------------------------
         고난[시련]
         ------------------------------------------ */

      if (topic === "고난[시련]") {

        area.innerHTML = `

          <div class="data-card">

            <div class="bible-section">

              <div class="bible-label">
                📖 성구
              </div>


              <a
                class="bible-title"
                href="https://wol.jw.org/ko/wol/l/r8/lp-ko?q=%EB%A1%9C%EB%A7%88%EC%84%9C+5%3A12"
                target="_blank"
                rel="noopener noreferrer"
              >
                로마서 5:12
              </a>


              <div class="bible-text">

                그러므로 한 사람을 통해 죄가 세상에 들어오고
                죄를 통해 죽음이 들어왔으며, 이와 같이 모두가
                죄를 지었으므로 죽음이 모든 사람에게 퍼졌습니다.

              </div>


              <a
                class="bible-button"
                href="https://wol.jw.org/ko/wol/l/r8/lp-ko?q=%EB%A1%9C%EB%A7%88%EC%84%9C+5%3A12"
                target="_blank"
                rel="noopener noreferrer"
              >
                성구 보기 ↗
              </a>

            </div>

          </div>

        `;

        return;
      }


      /* ------------------------------------------
         나머지 주제
         ------------------------------------------ */

      area.innerHTML = `

        <div class="empty-message">
          아직 등록된 자료가 없습니다.
        </div>

      `;
    }

  </script>

</body>
</html>
