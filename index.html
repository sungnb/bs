<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>봉사를 위한 준비</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7f6;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
}

.header {
    background: #3f7f4a;
    color: white;
    padding: 18px 20px;
    font-size: 23px;
    font-weight: 700;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 18px 12px 40px;
}

/* 24개 메뉴 */

.menu-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.menu-button {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 62px;
    padding: 8px 4px;

    background: white;
    border: 1px solid #d5ded7;
    border-radius: 12px;

    color: #222;
    font-size: 17px;
    font-weight: 700;

    text-align: center;
    line-height: 1.25;

    text-decoration: none;

    box-shadow: 0 3px 7px rgba(0,0,0,.10);

    cursor: pointer;
}

.menu-button:active {
    transform: scale(.96);
    background: #e8f3e9;
}

/* 주제 */

#topicPage {
    display: none;
}

.home-button {
    display: inline-block;

    margin-bottom: 18px;
    padding: 10px 15px;

    background: white;
    border: 1px solid #d5ded7;
    border-radius: 9px;

    color: #28733a;
    font-size: 15px;
    font-weight: 700;

    text-decoration: none;
}

.topic-title {
    margin-bottom: 18px;

    font-size: 27px;
    font-weight: 700;
}

/* 자료 카드 */

.data-card {
    background: white;
    border-radius: 14px;

    padding: 18px;
    margin-bottom: 15px;

    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.section-title {
    margin: 22px 4px 12px;

    color: #28733a;

    font-size: 19px;
    font-weight: 700;
}

/* 성구 */

.bible-title {
    display: block;

    color: #2f7040;

    font-size: 20px;
    font-weight: 700;

    text-decoration: none;
}

.bible-button {
    display: block;

    margin-top: 15px;
    padding: 14px;

    background: #3f7f4a;
    border-radius: 10px;

    color: white;

    text-align: center;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;
}

/* 주제 화면에서는 '봉사를 위한 준비' 제목을 숨깁니다. */
body.topic-mode .header {
    display: none;
}

/* 주제 화면에서는 홈 버튼을 화면 맨 위에 표시합니다. */
body.topic-mode .home-button {
    display: inline-block;
}

/* 링크 */

.link-button {
    display: block;

    width: 100%;

    padding: 14px;

    background: #3f7f4a;
    border-radius: 10px;

    color: white;

    text-align: center;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;
}

/* 이미지 */

.image-box img {
    display: block;

    width: 100%;
    height: auto;

    border-radius: 12px;
}

/* 로딩 */

.loading,
.empty,
.error {
    padding: 25px 18px;

    background: white;
    border-radius: 14px;

    text-align: center;

    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.loading {
    color: #666;
}

.empty {
    color: #777;
}

.error {
    color: #b33;
}

@media (max-width: 480px) {

    .header {
        font-size: 21px;
    }

    .menu-grid {
        gap: 8px;
    }

    .menu-button {
        min-height: 58px;
        font-size: 15px;
    }

    .topic-title {
        font-size: 24px;
    }
}
</style>
</head>

<body>

   ← 홈으로 돌아가기
</a>

<div id="topicTitle"
     class="topic-title">
</div>

<script>

/* ==================================================
   현재 단계
   ==================================================
   Cloudflare Worker는 사용하지 않습니다.

   우선 '고난[시련]' 하나가 원하는 방식으로 작동하는지
   확인합니다.

   성구는 Airtable의 '성구' 값만 사용해서
   WOL 주소를 자동으로 만듭니다.

   예:
   로마서 5:12
   ↓
   https://wol.jw.org/ko/wol/l/r8/lp-ko?q=로마서%205%3A12

   성구 제목 자체에는 링크를 걸지 않습니다.
   '성구 보기' 버튼만 WOL로 연결합니다.
   ================================================== */


/* =========================
   현재 테스트 자료
   ========================= */

const testData = {
    "고난[시련]": [
        {
            자료명: "링크",
            기록명: "고난[전도지]",
            링크: "https://wol.jw.org/ko/wol/d/r8/lp-ko/1102013410"
        },
        {
            자료명: "링크",
            기록명: "우리가 겪는 고난에 대한 책임이 하느님에게 있습니까? [성경 질문과 대답]",
            링크: "https://wol.jw.org/ko/wol/d/r8/lp-ko/502012504"
        },
        { 자료명: "성구", 성구: "요한1서 5:19" },
        { 자료명: "성구", 성구: "요한1서 3:8" },
        { 자료명: "성구", 성구: "로마서 5:12" },
        { 자료명: "성구", 성구: "로마서 3:23" },
        { 자료명: "성구", 성구: "전도서 9:11" },
        { 자료명: "성구", 성구: "야고보서 1:13-15" },
        { 자료명: "성구", 성구: "창세기 2:17" },
        {
            자료명: "링크",
            기록명: "지배[전도지]",
            링크: "https://wol.jw.org/ko/wol/d/r8/lp-ko/1102013400"
        },
        {
            자료명: "링크",
            기록명: "이토록 고난이 많은 이유가 무엇입니까? [깨 11/7]",
            링크: "https://wol.jw.org/ko/wol/d/r8/lp-ko/102011242"
        }
    ]
};


/* =========================
   HTML 안전 처리
   ========================= */

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   홈
   ========================= */

function goHome() {

    document.body.classList.remove("topic-mode");

    document.getElementById("topicPage").style.display = "none";

    document.getElementById("homePage").style.display = "block";

    window.scrollTo(0,0);
}


/* =========================
   주제 열기
   ========================= */

async function openTopic(topic) {

    document.getElementById("homePage").style.display = "none";

    document.getElementById("topicPage").style.display = "block";

    /*
     * 홈 화면의 '봉사를 위한 준비'를 숨깁니다.
     */
    document.body.classList.add("topic-mode");

    document.getElementById("topicTitle").textContent = topic;

    document.getElementById("topicData").innerHTML = `
        <div class="loading">
            자료를 불러오는 중입니다...
        </div>
    `;

    window.scrollTo(0,0);

    await loadData(topic);
}


/* =========================
   자료 가져오기
   ========================= */

async function loadData(topic) {

    const area =
        document.getElementById("topicData");

    /*
     * 현재는 고난[시련]만 테스트합니다.
     */
    const records = testData[topic] || [];

    if (!records.length) {

        area.innerHTML = `
            <div class="empty">
                아직 준비 중인 자료입니다.
            </div>
        `;

        return;
    }

    /*
     * 중요:
     * records를 링크/성구로 다시 나누지 않습니다.
     *
     * 배열의 순서 그대로 표시합니다.
     */
    renderRecords(records);
}


/* =========================
   Airtable 필드값
   ========================= */

function field(record, name) {

    if (record[name] !== undefined) {
        return record[name];
    }

    if (record.fields &&
        record.fields[name] !== undefined) {
        return record.fields[name];
    }

    return "";
}


/* =========================
   URL 가져오기
   ========================= */

function getURL(value) {

    if (!value) {
        return "";
    }

    if (typeof value === "string") {
        return value;
    }

    if (Array.isArray(value)) {

        if (!value.length) {
            return "";
        }

        if (typeof value[0] === "string") {
            return value[0];
        }

        if (value[0].url) {
            return value[0].url;
        }
    }

    if (value.url) {
        return value.url;
    }

    return "";
}


/* =========================
   성구 WOL 주소
   ========================= */

function bibleURL(reference) {

    return (
        "https://wol.jw.org/ko/wol/l/r8/lp-ko?q=" +
        encodeURIComponent(String(reference).trim())
    );
}


/* =========================
   자료 표시
   ========================= */

function renderRecords(records) {

    const area =
        document.getElementById("topicData");

    let html = "";


    records.forEach(function(record) {

        const type =
            field(record, "자료명");

        let typeName = "";

        if (typeof type === "string") {

            typeName = type;

        } else if (
            type &&
            type.name
        ) {

            typeName = type.name;
        }


        const title =
            field(record, "기록명");

        const bible =
            field(record, "성구");

        const link =
            getURL(
                field(record, "링크")
            );


        /* =========================
           링크
        ========================= */

        if (
            typeName === "링크" &&
            link
        ) {

            html += `
                <div class="data-card">

                    ${
                        title
                        ? `
                        <div style="
                            margin-bottom:12px;
                            font-size:18px;
                            font-weight:700;
                            line-height:1.45;">
                            ${escapeHTML(title)}
                        </div>
                        `
                        : ""
                    }

                    <a
                      class="link-button"
                      href="${escapeHTML(link)}"
                      target="_blank"
                      rel="noopener noreferrer">

                      자료 보기 ↗

                    </a>

                </div>
            `;

            return;
        }


        /* =========================
           성구
        ========================= */

        if (
            typeName === "성구" &&
            bible
        ) {

            const safeBible =
                escapeHTML(bible);

            const url =
                bibleURL(bible);


            html += `
                <div class="data-card">

                    <!-- 성구 제목 자체에는 링크가 없습니다. -->
                    <div class="bible-title">
                        ${safeBible}
                    </div>

                    <a
                      class="bible-button"
                      href="${escapeHTML(url)}"
                      target="_blank"
                      rel="noopener noreferrer">

                      성구 보기

                    </a>

                </div>
            `;

        }

    });


    if (!html) {

        html = `
            <div class="empty">
                자료 내용이 없습니다.
            </div>
        `;
    }


    area.innerHTML = html;
}

</script></script>
