<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>성구 자료</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7f6;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
      color: #222;
    }

    .header {
      background: #3f7f4a;
      color: white;
      padding: 18px 20px;
      font-size: 23px;
      font-weight: 700;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    .page-title {
      font-size: 27px;
      font-weight: 700;
      margin: 8px 4px 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .title {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .row {
      display: flex;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .label {
      width: 75px;
      flex-shrink: 0;
      color: #666;
      font-weight: 600;
    }

    .value {
      flex: 1;
    }

    .type {
      display: inline-block;
      background: #d9f4df;
      color: #28733a;
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    /* 성구 미리보기 영역 */
    .bible-section {
      margin-top: 22px;
      padding: 18px;
      background: #f7faf7;
      border-radius: 12px;
      border: 1px solid #e1ebe3;
    }

    .bible-label {
      font-size: 16px;
      font-weight: 700;
      color: #28733a;
      margin-bottom: 12px;
    }

    .bible-title {
      display: inline-block;
      color: #2f7040;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 12px;
    }

    .bible-title::after {
      content: " ↗";
      font-size: 16px;
    }

    .bible-title:active {
      opacity: 0.6;
    }

    .bible-text {
      font-size: 17px;
      line-height: 1.8;
      color: #333;
    }

    .bible-button {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 14px 16px;
      border: none;
      border-radius: 10px;
      background: #3f7f4a;
      color: white;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .bible-button:active {
      transform: scale(0.98);
    }

    @media (max-width: 480px) {

      .header {
        font-size: 21px;
        padding: 16px;
      }

      .container {
        padding: 14px 10px 30px;
      }

      .page-title {
        font-size: 24px;
      }

      .card {
        padding: 19px 16px;
      }

      .title {
        font-size: 21px;
      }

      .row {
        font-size: 16px;
      }

      .label {
        width: 70px;
      }

      .bible-section {
        padding: 16px;
      }

      .bible-title {
        font-size: 19px;
      }

      .bible-text {
        font-size: 16px;
        line-height: 1.75;
      }

      .bible-button {
        font-size: 17px;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    봉사를 위한 준비
  </div>

  <main class="container">

    <div class="page-title">
      성구 자료
    </div>

    <div class="card">

      <div class="title">
        고난에대한 성구
      </div>

      <div class="row">
        <div class="label">자료유형</div>
        <div class="value">
          <span class="type">성구</span>
        </div>
      </div>

      <div class="row">
        <div class="label">설명</div>
        <div class="value">
          고난과 시련에 대한 말씀
        </div>
      </div>


      <!-- =========================
           성구 미리보기
           ========================= -->

      <div class="bible-section">

        <div class="bible-label">
          📖 성구
        </div>

        <!--
          로마서 5:12를 누르면
          로마서 5장 전체가 아니라
          해당 성구로 이동하도록 주소를 설정
        -->
        <a
          class="bible-title"
          href="https://wol.jw.org/ko/wol/d/r8/lp-ko/1001061145#h=12"
          target="_blank"
          rel="noopener noreferrer"
        >
          로마서 5:12
        </a>


        <!-- 성구 본문 -->
        <div class="bible-text">

          그러므로 한 사람을 통해 죄가 세상에 들어오고
          죄를 통해 죽음이 들어왔으며, 이와 같이 모두가
          죄를 지었으므로 죽음이 모든 사람에게 퍼졌습니다.

        </div>


        <!-- 성구 보기 버튼 -->

        <a
          class="bible-button"
          href="https://wol.jw.org/ko/wol/d/r8/lp-ko/1001061145#h=12"
          target="_blank"
          rel="noopener noreferrer"
        >
          성구 보기 ↗
        </a>

      </div>

    </div>

  </main>

</body>
</html>
