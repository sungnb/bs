/* ==================================================
   메뉴 버튼
   ================================================== */

.menu-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.menu-button {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 62px;
    padding: 8px 4px;

    border-radius: 15px;
    border: 2px solid rgba(70,70,70,.42);

    color: #111;
    font-size: 17px;
    font-weight: 900;

    text-align: center;
    line-height: 1.2;

    text-decoration: none;
    cursor: pointer;

    box-shadow:
        inset 0 3px 2px rgba(255,255,255,.95),
        inset 0 -5px 4px rgba(0,0,0,.18),
        0 4px 0 rgba(70,70,70,.28),
        0 6px 9px rgba(0,0,0,.18);

    text-shadow:
        0 1px 0 rgba(255,255,255,.75);

    transform: translateY(0);

    transition:
        transform .08s ease,
        box-shadow .08s ease,
        filter .08s ease;
}

.menu-button::before {
    content: "";

    position: absolute;

    left: 7%;
    right: 7%;
    top: 5px;

    height: 35%;

    border-radius: 10px;

    background: linear-gradient(
        to bottom,
        rgba(255,255,255,.48),
        rgba(255,255,255,0)
    );

    pointer-events: none;
}


/* 1~6 분홍 */

.menu-button:nth-child(-n+6) {
    background:
        linear-gradient(
            to bottom,
            #f9dce2 0%,
            #efbdc9 42%,
            #d99ba9 100%
        );

    border-color: #a96f7d;
}


/* 7~12 노랑 */

.menu-button:nth-child(n+7):nth-child(-n+12) {
    background:
        linear-gradient(
            to bottom,
            #fffbe8 0%,
            #f0e5bd 42%,
            #d7c99a 100%
        );

    border-color: #a99b68;
}


/* 13~18 초록 */

.menu-button:nth-child(n+13):nth-child(-n+18) {
    background:
        linear-gradient(
            to bottom,
            #e4f4e6 0%,
            #c7e2cc 42%,
            #a2c5aa 100%
        );

    border-color: #72997b;
}


/* 19~24 파랑 */

.menu-button:nth-child(n+19):nth-child(-n+24) {

            #e6f2ff 0%,

<script>

/* ==================================================
   Cloudflare Worker
   ================================================== */

const API_URL =
    "https://seoulbukbu.s01021319376.workers.dev/";


/* ==================================================
   HTML 안전 처리
   ================================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==================================================
   홈
   ================================================== */

function goHome() {

    document.body.classList.remove(
        "topic-mode"
    );

    document.getElementById(
        "topicPage"
    ).style.display = "none";

    document.getElementById(
        "homePage"
    ).style.display = "block";

    window.scrollTo(0, 0);
}


/* ==================================================
   주제 열기
   ================================================== */

async function openTopic(topic) {

    document.getElementById(
        "homePage"
    ).style.display = "none";


    document.getElementById(
        "topicPage"
    ).style.display = "block";


    document.body.classList.add(
        "topic-mode"
    );


    document.getElementById(
        "topicTitle"
    ).textContent = topic;


    document.getElementById(
        "topicData"
    ).innerHTML = `
        <div class="loading">
            자료를 불러오는 중입니다...
        </div>
    `;


    window.scrollTo(0, 0);


    await loadData(topic);
}


/* ==================================================
   Worker에서 현재 주제 자료 가져오기
   ★ 핵심 수정 부분
   ================================================== */

async function loadData(topic) {

    const area =
        document.getElementById(
            "topicData"
        );


    try {

        /*
         * Worker가 요구하는 topic을
         * URL에 반드시 붙입니다.
         */

        const url =
            API_URL +
            "?topic=" +
            encodeURIComponent(topic);


        console.log(
            "Worker 요청:",
            url
        );


        const response =
            await fetch(url, {
                method: "GET",
                cache: "no-store"
            });


        const data =
            await response.json();


        console.log(
            "Worker 응답:",
            data
        );


        if (!response.ok) {

            throw new Error(
                "Worker 응답 오류 (" +
                response.status +
                ")"
            );
        }


        if (
            !data.success
        ) {

            throw new Error(
                data.error ||
                data.message ||
                "자료를 가져오지 못했습니다."
            );
        }


        if (
            !Array.isArray(data.records)
        ) {

            throw new Error(
                "records 형식이 올바르지 않습니다."
            );
        }


        /*
         * Worker가 이미 해당 topic의
         * 자료만 보내므로 여기서 다시
         * 메뉴를 필터링하지 않습니다.
         */

        const records =
            data.records;


        /*
         * Airtable 순서
         */

        records.sort(
            function(a, b) {

                const aOrder =
                    Number(
                        a.fields?.["순서"]
                    ) || 999999;


                const bOrder =
                    Number(
                        b.fields?.["순서"]
                    ) || 999999;


                return aOrder - bOrder;
            }
        );


        if (!records.length) {

            area.innerHTML = `
                <div class="empty">
                    아직 준비 중인 자료입니다.
                </div>
            `;

            return;
        }


        renderRecords(records);


    } catch (error) {

        console.error(
            "자료 불러오기 오류:",
            error
        );


        area.innerHTML = `
            <div class="error">
                자료를 불러오지 못했습니다.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;
    }
}


/* ==================================================
   URL 처리
   ================================================== */

function getURL(value) {

    if (!value) {
        return "";
    }


    if (
        typeof value === "string"
    ) {
        return value;
    }


    if (
        Array.isArray(value)
    ) {

        if (!value.length) {
            return "";
        }


        if (
            typeof value[0] === "string"
        ) {
            return value[0];
        }


        if (
            value[0] &&
            value[0].url
        ) {
            return value[0].url;
        }
    }


    if (
        value &&
        value.url
    ) {
        return value.url;
    }


    return "";
}


/* ==================================================
   성구 WOL 주소
   ================================================== */

function bibleURL(reference) {

    return (
        "https://wol.jw.org/ko/wol/l/r8/lp-ko?q=" +
        encodeURIComponent(
            String(reference).trim()
        )
    );
}


/* ==================================================
   성구 본문 정리
   ================================================== */

function cleanBibleText(text) {

    if (!text) {
        return "";
    }


    let result =
        String(text);


    const startMarker =
        "신세계역 성경 (연구용)";


    const startIndex =
        result.indexOf(
            startMarker
        );


    if (
        startIndex !== -1
    ) {

        result =
            result.substring(
                startIndex +
                startMarker.length
            );
    }


    const endMarkers = [

        "한국어 워치 타워 출판물",

        "한국어 워치 타워",

        "Copyright",

        "저작권",

        "이용 약관",

        "개인 정보 보호",

        "JW.ORG"

    ];


    let end =
        result.length;


    for (
        const marker of endMarkers
    ) {

        const index =
            result.indexOf(marker);


        if (
            index !== -1 &&
            index < end
        ) {
            end = index;
        }
    }


    result =
        result.substring(
            0,
            end
        );


    result =
        result
            .replace(
                /&copy;/gi,
                ""
            )
            .replace(
                /&amp;/gi,
                "&"
            )
            .replace(
                /&quot;/gi,
                '"'
            )
            .replace(
                /&#39;/gi,
                "'"
            )
            .replace(
                /\s+\*/g,
                ""
            )
            .replace(
                /\s+\+/g,
                ""
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    return result;
}


/* ==================================================
   자료 표시
   ================================================== */

function renderRecords(records) {

    const area =
        document.getElementById(
            "topicData"
        );


    let html = "";


    records.forEach(
        function(record) {

            const fields =
                record.fields || {};


            /*
             * ★ 자료명
             *
             * 이제 자료명은
             * 사용자가 원하는 제목입니다.
             *
             * 예:
             * 부지런한 사람
             * 불교를 믿는 사람
             */

            const title =
                String(
                    fields["자료명"] ||
                    fields["기록명"] ||
                    ""
                ).trim();


            /*
             * ★ 성구
             *
             * 자료명이 무엇이든
             * 성구 필드에 값이 있으면
             * 성구 자료입니다.
             */

            const bible =
                String(
                    fields["성구"] ||
                    ""
                ).trim();


            const link =
                getURL(
                    fields["링크"]
                );


            const note =
                fields["노트"] ||
                "";


            const imageValue =
                fields["이미지"];


            /* ==========================================
               이미지
               ========================================== */

            let imageHTML = "";


            if (
                Array.isArray(imageValue)
            ) {

                imageValue.forEach(
                    function(file) {

                        if (
                            file &&
                            file.url
                        ) {

                            imageHTML += `
                                <div class="image-box">

                                    <a
                                        href="${escapeHTML(file.url)}"
                                        target="_blank"
                                        rel="noopener noreferrer">

                                        <img
                                            src="${escapeHTML(file.url)}"
                                            alt="${escapeHTML(file.filename || "이미지")}">

                                    </a>

                                </div>
                            `;
                        }
                    }
                );

            } else {

                const imageURL =
                    getURL(
                        imageValue
                    );


                if (imageURL) {

                    imageHTML = `
                        <div class="image-box">

                            <a
                                href="${escapeHTML(imageURL)}"
                                target="_blank"
                                rel="noopener noreferrer">

                                <img
                                    src="${escapeHTML(imageURL)}"
                                    alt="이미지">

                            </a>

                        </div>
                    `;
                }
            }


            /* ==========================================
               ★ 성구 자료
               ========================================== */

            if (bible) {

                const bibleText =
                    cleanBibleText(
                        record.bibleText
                    );


                const url =
                    record.bibleUrl ||
                    bibleURL(bible);


                html += `

                    <div class="data-card">

                        ${
                            title
                            ? `
                            <div class="record-title">
                                ${escapeHTML(title)}
                            </div>
                            `
                            : ""
                        }


                        <div class="bible-reference">
                            ${escapeHTML(bible)}
                        </div>


                        ${
                            bibleText
                            ? `
                            <div class="bible-text">
                                ${escapeHTML(bibleText)}
                            </div>
                            `
                            : `
                            <div
                                style="
                                    margin-top:15px;
                                    color:#777;
                                    font-size:14px;
                                "
                            >
                                성구 내용을 불러오지 못했습니다.
                            </div>
                            `
                        }


                        <a
                            class="bible-button"
                            href="${escapeHTML(url)}"
                            target="_blank"
                            rel="noopener noreferrer">

                            성구 보기 ↗

                        </a>

                    </div>

                `;


                return;
            }


            /* ==========================================
               링크 자료
               ========================================== */

            if (link) {

                html += `

                    <div class="data-card">

                        ${
                            title
                            ? `
                            <div class="record-title">
                                ${escapeHTML(title)}
                            </div>
                            `
                            : ""
                        }


                        <a
                            class="link-button"
                            href="${escapeHTML(link)}"
                            target="_blank"
                            rel="noopener noreferrer">

                            자료 보기 ↗

                        </a>

                    </div>

                `;


                return;
            }


            /* ==========================================
               노트 / 이미지
               ========================================== */

            if (
                note ||
                imageHTML
            ) {

                html += `

                    <div class="data-card">

                        ${
                            title
                            ? `
                            <div class="record-title">
                                ${escapeHTML(title)}
                            </div>
                            `
                            : ""
                        }


                        ${
                            note
                            ? `
                            <div class="note-view">
                                ${renderNoteContent(note)}
                            </div>
                            `
                            : ""
                        }


                        ${imageHTML}

                    </div>

                `;


                return;
            }


            /* ==========================================
               자료명만 있는 경우
               ========================================== */

            if (title) {

                html += `

                    <div class="data-card">

                        <div class="record-title">
                            ${escapeHTML(title)}
                        </div>

                    </div>

                `;
            }

        }
    );


    if (!html) {

        html = `
            <div class="empty">
                자료 내용이 없습니다.
            </div>
        `;
    }


    area.innerHTML =
        html;
}


/* ==================================================
   노트 표시
   ================================================== */

function renderNoteContent(note) {

    if (!note) {
        return "";
    }


    let value =
        String(note);


    /*
     * HTML이 아니면 일반 텍스트 처리
     */

    if (
        !/<[a-z][\s\S]*>/i.test(value)
    ) {

        value =
            escapeHTML(value)
                .replace(
                    /\*\*(.+?)\*\*/g,
                    "<strong>$1</strong>"
                )
                .replace(
                    /__(.+?)__/g,
                    "<strong>$1</strong>"
                )
                .replace(
                    /\*(.+?)\*/g,
                    "<em>$1</em>"
                )
                .replace(
                    /_(.+?)_/g,
                    "<em>$1</em>"
                )
                .replace(
                    /\n/g,
                    "<br>"
                );
    }


    /*
     * 허용 태그만 표시
     */

    const template =
        document.createElement(
            "template"
        );


    template.innerHTML =
        value;


    const allowedTags =
        new Set([
            "B",
            "STRONG",
            "I",
            "EM",
            "U",
            "BR",
            "P",
            "DIV",
            "SPAN",
            "UL",
            "OL",
            "LI"
        ]);


    template.content
        .querySelectorAll("*")
        .forEach(
            function(el) {

                if (
                    !allowedTags.has(
                        el.tagName
                    )
                ) {

                    const text =
                        document.createTextNode(
                            el.textContent || ""
                        );


                    el.replaceWith(
                        text
                    );


                    return;
                }


                /*
                 * 위험한 속성 제거
                 */

                [...el.attributes]
                    .forEach(
                        function(attr) {

                            if (
                                attr.name !==
                                "style"
                            ) {

                                el.removeAttribute(
                                    attr.name
                                );
                            }
                        }
                    );
            }
        );


    return template.innerHTML;
}


/* ==================================================
   비밀번호 잠금
   ================================================== */

const APP_PASSWORD = "1914";
const PASSWORD_KEY = "bs_password_ok";

function unlockApp() {
    const lock = document.getElementById("passwordLock");
    if (lock) {
        lock.style.display = "none";
    }
    document.body.style.overflow = "";
}

function checkPassword() {
    const input = document.getElementById("passwordInput");
    const error = document.getElementById("passwordError");

    if (input.value === APP_PASSWORD) {
        const remember =
            document.getElementById("rememberPassword").checked;

        if (remember) {
            localStorage.setItem(PASSWORD_KEY, "1");
        } else {
            sessionStorage.setItem(PASSWORD_KEY, "1");
            localStorage.removeItem(PASSWORD_KEY);
        }

        unlockApp();
        input.value = "";
        error.textContent = "";
    } else {
        error.textContent = "비밀번호가 올바르지 않습니다.";
        input.value = "";
        input.focus();
    }
}

document.addEventListener("DOMContentLoaded", function () {
    const input = document.getElementById("passwordInput");

    if (
        localStorage.getItem(PASSWORD_KEY) === "1" ||
        sessionStorage.getItem(PASSWORD_KEY) === "1"
    ) {
        unlockApp();
    } else {
        document.body.style.overflow = "hidden";
        setTimeout(function () {
            if (input) input.focus();
        }, 100);
    }

    if (input) {
        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    }
});

</script>


<script>
/* ==================================================
   화면 테마 설정
   - localStorage에 선택 상태 저장
   - 페이지를 다시 열어도 유지
   - 메뉴/자료 기능에는 영향 없음
================================================== */

const THEME_KEY = "bsScreenTheme";

const settingsButton = document.getElementById("settingsButton");
const settingsMenu = document.getElementById("settingsMenu");
const lightThemeButton = document.getElementById("lightThemeButton");
const darkThemeButton = document.getElementById("darkThemeButton");

function applyTheme(theme) {
    const isDark = theme === "dark";

    document.body.classList.toggle("dark-theme", isDark);
    document.documentElement.classList.toggle("dark-theme", isDark);

    try {
        localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
    } catch (error) {}

    settingsMenu.classList.remove("show");
    settingsButton.setAttribute("aria-expanded", "false");
}

function loadTheme() {
    let theme = "light";

    try {
        theme = localStorage.getItem(THEME_KEY) || "light";
    } catch (error) {}

    applyTheme(theme);
}

settingsButton.addEventListener("click", function(event) {
    event.stopPropagation();

    const open = settingsMenu.classList.toggle("show");
    settingsButton.setAttribute("aria-expanded", open ? "true" : "false");
});

lightThemeButton.addEventListener("click", function() {
    applyTheme("light");
});

darkThemeButton.addEventListener("click", function() {
    applyTheme("dark");
});

document.addEventListener("click", function(event) {
    if (!document.getElementById("settingsWrap").contains(event.target)) {
        settingsMenu.classList.remove("show");
        settingsButton.setAttribute("aria-expanded", "false");
    }
});

/* 가장 먼저 테마 적용 */
loadTheme();
</script>
