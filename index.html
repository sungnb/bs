<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>봉사를 위한 준비</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7f6;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
}

.header {
    background: #3f7f4a;
    color: white;
    padding: 18px 20px;
    font-size: 23px;
    font-weight: 700;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 18px 12px 40px;
}

/* 24개 메뉴 */

.menu-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.menu-button {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 62px;
    padding: 8px 4px;

    background: white;
    border: 1px solid #d5ded7;
    border-radius: 12px;

    color: #222;
    font-size: 17px;
    font-weight: 700;

    text-align: center;
    line-height: 1.25;

    text-decoration: none;

    box-shadow: 0 3px 7px rgba(0,0,0,.10);

    cursor: pointer;
}

.menu-button:active {
    transform: scale(.96);
    background: #e8f3e9;
}

/* 주제 */

#topicPage {
    display: none;
}

.home-button {
    display: inline-block;

    margin-bottom: 18px;
    padding: 10px 15px;

    background: white;
    border: 1px solid #d5ded7;
    border-radius: 9px;

    color: #28733a;
    font-size: 15px;
    font-weight: 700;

    text-decoration: none;
}

.topic-title {
    margin-bottom: 18px;

    font-size: 27px;
    font-weight: 700;
}

/* 자료 카드 */

.data-card {
    background: white;
    border-radius: 14px;

    padding: 18px;
    margin-bottom: 15px;

    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.section-title {
    margin: 22px 4px 12px;

    color: #28733a;

    font-size: 19px;
    font-weight: 700;
}

/* 성구 */

.bible-title {
    display: block;

    color: #2f7040;

    font-size: 20px;
    font-weight: 700;

    text-decoration: none;
}

.bible-title::after {
    content: " ↗";
    font-size: 16px;
}

.bible-button {
    display: block;

    margin-top: 15px;
    padding: 14px;

    background: #3f7f4a;
    border-radius: 10px;

    color: white;

    text-align: center;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;
}

/* 링크 */

.link-button {
    display: block;

    width: 100%;

    padding: 14px;

    background: #3f7f4a;
    border-radius: 10px;

    color: white;

    text-align: center;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;
}

/* 이미지 */

.image-box img {
    display: block;

    width: 100%;
    height: auto;

    border-radius: 12px;
}

/* 로딩 */

.loading,
.empty,
.error {
    padding: 25px 18px;

    background: white;
    border-radius: 14px;

    text-align: center;

    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.loading {
    color: #666;
}

.empty {
    color: #777;
}

.error {
    color: #b33;
}

@media (max-width: 480px) {

    .header {
        font-size: 21px;
    }

    .menu-grid {
        gap: 8px;
    }

    .menu-button {
        min-height: 58px;
        font-size: 15px;
    }

    .topic-title {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="header">
    봉사를 위한 준비
</div>

<main class="container">

<!-- =========================

     ========================= -->

<div class="menu-grid">

<a class="menu-button"

<a class="menu-button"

<a class="menu-button"

<a class="menu-button"

<a class="menu-button"

<a class="menu-button"

<a class="menu-button"

<a class="menu-button"

<a class="menu-button"

<a class="menu-button"

<a class="menu-button"

</a>

</div>
</section>


<!-- =========================
     자료 화면
     ========================= -->

<section id="topicPage">

<a href="#"
   class="home-button"
   onclick="goHome();return false;">
   ← 홈으로 돌아가기
</a>

<div id="topicTitle"
     class="topic-title">
</div>

<div id="topicData">
</div>

</section>

</main>


<script>

/*
==================================================
Airtable 중간 연결 주소
==================================================

여기에 Cloudflare Worker 주소를 넣습니다.

예:

const API_URL =
"https://snb-airtable.xxxxx.workers.dev";

지금은 아직 Worker를 만들지 않았으므로
빈 상태로 둡니다.
==================================================
*/

const API_URL =
"여기에_중간연결주소";


/* =========================
   HTML 안전 처리
   ========================= */

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   홈
   ========================= */

function goHome() {

    document.getElementById(
        "topicPage"
    ).style.display = "none";

    document.getElementById(
        "homePage"
    ).style.display = "block";

    window.scrollTo(0,0);
}


/* =========================
   주제 열기
   ========================= */

async function openTopic(topic) {

    document.getElementById(
        "homePage"
    ).style.display = "none";

    document.getElementById(
        "topicPage"
    ).style.display = "block";

    document.getElementById(
        "topicTitle"
    ).textContent = topic;

    document.getElementById(
        "topicData"
    ).innerHTML = `
        <div class="loading">
            자료를 불러오는 중입니다...
        </div>
    `;

    window.scrollTo(0,0);

    await loadAirtableData(topic);
}


/* =========================
   Airtable 자료 가져오기
   ========================= */

async function loadAirtableData(topic) {

    const area =
        document.getElementById(
            "topicData"
        );

    try {

        /*
        중간 연결 주소로:

        ?menu=고난%5B시련%5D

        를 전달합니다.
        */

        const url =
            API_URL +
            "?menu=" +
            encodeURIComponent(topic);


        const response =
            await fetch(url, {
                method: "GET",
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        const records =
            Array.isArray(data)
            ? data
            : data.records;


        if (!records ||
            records.length === 0) {

            area.innerHTML = `
                <div class="empty">
                    등록된 자료가 없습니다.
                </div>
            `;

            return;
        }


        renderRecords(records);


    } catch(error) {

        console.error(error);

        area.innerHTML = `
            <div class="error">
                자료를 불러오지 못했습니다.
                <br><br>
                잠시 후 다시 시도해 주세요.
            </div>
        `;
    }
}


/* =========================
   Airtable 값 가져오기
   ========================= */

function field(record, name) {

    if (record[name] !== undefined) {
        return record[name];
    }

    if (record.fields &&
        record.fields[name] !== undefined) {
        return record.fields[name];
    }

    return "";
}


/* =========================
   URL 가져오기
   ========================= */

function getURL(value) {

    if (!value) {
        return "";
    }

    if (typeof value === "string") {
        return value;
    }

    if (Array.isArray(value)) {

        if (!value.length) {
            return "";
        }

        if (typeof value[0] === "string") {
            return value[0];
        }

        if (value[0].url) {
            return value[0].url;
        }
    }

    if (value.url) {
        return value.url;
    }

    return "";
}


/* =========================
   이미지 가져오기
   ========================= */

function getImage(value) {

    if (!value) {
        return "";
    }

    if (typeof value === "string") {
        return value;
    }

    if (Array.isArray(value)) {

        if (!value.length) {
            return "";
        }

        if (value[0].url) {
            return value[0].url;
        }
    }

    if (value.url) {
        return value.url;
    }

    return "";
}


/* =========================
   성구 링크
   ========================= */

function bibleURL(reference) {

    return (
        "https://wol.jw.org/ko/wol/l/r8/lp-ko?q=" +
        encodeURIComponent(reference)
    );
}


/* =========================
   자료 표시
   ========================= */

function renderRecords(records) {

    const area =
        document.getElementById(
            "topicData"
        );


    let links = "";
    let bibles = "";
    let images = "";


    records.forEach(function(record) {

        const type =
            field(record,"자료명");


        /*
        Single select가
        객체로 넘어오는 경우
        */

        let typeName = "";

        if (typeof type === "string") {

            typeName = type;

        } else if (
            type &&
            type.name
        ) {

            typeName = type.name;
        }


        const bible =
            field(record,"성구");


        const link =
            getURL(
                field(record,"링크")
            );


        const image =
            getImage(
                field(record,"이미지")
            );


        /*
        링크
        */

        if (
            typeName === "링크" &&
            link
        ) {

            links += `
                <div class="data-card">
                    <a
                      class="link-button"
                      href="${escapeHTML(link)}"
                      target="_blank"
                      rel="noopener noreferrer">
                      자료 보기 ↗
                    </a>
                </div>
            `;
        }


        /*
        성구
        */

        if (
            typeName === "성구" &&
            bible
        ) {

            const safeBible =
                escapeHTML(bible);


            const url =
                link ||
                bibleURL(bible);


            bibles += `
                <div class="data-card">

                    <a
                      class="bible-title"
                      href="${escapeHTML(url)}"
                      target="_blank"
                      rel="noopener noreferrer">

                      ${safeBible}

                    </a>

                    <a
                      class="bible-button"
                      href="${escapeHTML(url)}"
                      target="_blank"
                      rel="noopener noreferrer">

                      성구 보기 ↗

                    </a>

                </div>
            `;
        }


        /*
        이미지
        */

        if (
            typeName === "이미지" &&
            image
        ) {

            images += `
                <div class="data-card">

                    <div class="image-box">

                        <img
                          src="${escapeHTML(image)}"
                          alt="자료 이미지"
                          loading="lazy">

                    </div>

                </div>
            `;
        }

    });


    let html = "";


    if (links) {

        html += `
            <div class="section-title">
                🔗 링크
            </div>

            ${links}
        `;
    }


    if (bibles) {

        html += `
            <div class="section-title">
                📖 성구
            </div>

            ${bibles}
        `;
    }


    if (images) {

        html += `
            <div class="section-title">
                🖼 이미지
            </div>

            ${images}
        `;
    }


    if (!html) {

        html = `
            <div class="empty">
                자료 내용이 없습니다.
            </div>
        `;
    }


    area.innerHTML = html;
}

</script>

</body>
