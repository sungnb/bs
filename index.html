<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>봉사를 위한 준비</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7f6;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
}

.header {
    background: #3f7f4a;
    color: white;
    padding: 18px 20px;
    font-size: 23px;
    font-weight: 700;
}

/* 주제 화면에서는 메인 제목 숨김 */
body.topic-mode .header {
    display: none;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 18px 12px 40px;
}

/* 주제 화면에서는 맨 위부터 시작 */
body.topic-mode .container {
    padding-top: 0;
}

/* =========================
   메뉴
   ========================= */

.menu-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.menu-button {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 62px;
    padding: 8px 4px;

    background: white;
    border: 1px solid #d5ded7;
    border-radius: 12px;

    color: #222;
    font-size: 17px;
    font-weight: 700;

    text-align: center;
    line-height: 1.25;

    text-decoration: none;

    box-shadow: 0 3px 7px rgba(0,0,0,.10);

    cursor: pointer;
}

.menu-button:active {
    transform: scale(.96);
    background: #e8f3e9;
}

/* =========================
   주제
   ========================= */

#topicPage {
    display: none;
}

.home-button {
    display: inline-block;

    margin: 0 0 18px 0;
    padding: 10px 15px;

    background: white;
    border: 1px solid #d5ded7;
    border-radius: 9px;

    color: #28733a;
    font-size: 15px;
    font-weight: 700;

    text-decoration: none;
}

.topic-title {
    margin-bottom: 18px;

    font-size: 27px;
    font-weight: 700;
}

/* =========================
   자료 카드
   ========================= */

.data-card {
    background: white;
    border-radius: 14px;

    padding: 18px;
    margin-bottom: 15px;

    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.section-title {
    margin: 22px 4px 12px;

    color: #28733a;

    font-size: 19px;
    font-weight: 700;
}

/* =========================
   성구
   ========================= */

.bible-title {
    display: block;

    color: #2f7040;

    font-size: 20px;
    font-weight: 700;

    text-decoration: none;
}

/* 성구 내용 */

.bible-text {
    margin-top: 15px;

    padding: 15px;

    background: #f5f7f6;

    border-radius: 10px;

    color: #333;

    font-size: 16px;
    line-height: 1.8;

    text-align: left;
}

/* 성구 보기 */

.bible-button {
    display: block;

    margin-top: 15px;
    padding: 14px;

    background: #3f7f4a;
    border-radius: 10px;

    color: white;

    text-align: center;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;
}

/* =========================
   노트
   ========================= */

.note-box {
    margin-top: 12px;
    padding: 15px;
    background: #f5f7f6;
    border-radius: 10px;
    color: #333;
    font-size: 16px;
    line-height: 1.8;
    white-space: pre-wrap;
    text-align: left;
}

/* =========================
   이미지
   ========================= */

.image-box {
    margin-top: 12px;
    text-align: center;
}

.image-box img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    border-radius: 10px;
    cursor: pointer;
}

/* =========================
   링크
   ========================= */

.link-button {
    display: block;

    width: 100%;

    padding: 14px;

    background: #3f7f4a;
    border-radius: 10px;

    color: white;

    text-align: center;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;
}

/* =========================
   상태
   ========================= */

.loading,
.empty,
.error {
    padding: 25px 18px;

    background: white;
    border-radius: 14px;

    text-align: center;

    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.loading {
    color: #666;
}

.empty {
    color: #777;
}

.error {
    color: #b33;
}

/* =========================
   모바일
   ========================= */

@media (max-width: 480px) {

    .header {
        font-size: 21px;
    }

    .menu-grid {
        gap: 8px;
    }

    .menu-button {
        min-height: 58px;
        font-size: 15px;
    }

    .topic-title {
        font-size: 24px;
    }

    .bible-text {
        font-size: 15px;
        line-height: 1.75;
    }
}

/* ===== PC 노트 편집기 ===== */
.note-edit-button{
    display:inline-block;
    margin-top:12px;
    padding:9px 14px;
    border:1px solid #d0d7de;
    border-radius:8px;
    background:#fff;
    color:#333;
    cursor:pointer;
    font-size:14px;
}
.note-edit-button:hover{background:#f3f5f7}

.note-view{
    margin-top:12px;
    padding:16px;
    background:#f5f7f6;
    border-radius:10px;
    color:#333;
    line-height:1.8;
    text-align: left;
    overflow-wrap:anywhere;
}
.note-view .note-p{margin:0 0 10px}
.note-view .note-p:last-child{margin-bottom:0}

.note-editor-overlay{
    position:fixed; inset:0; z-index:9999;
    background:rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
}
.note-editor{
    width:min(900px,96vw);
    max-height:90vh;
    background:#fff;
    border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    display:flex; flex-direction:column;
    overflow:hidden;
}
.note-editor-head{
    padding:16px 18px;
    border-bottom:1px solid #e5e7eb;
    display:flex; justify-content:space-between; align-items:center;
}
.note-editor-title{font-size:18px;font-weight:700}
.note-editor-toolbar{
    padding:10px;
    border-bottom:1px solid #e5e7eb;
    display:flex; gap:6px; flex-wrap:wrap; align-items:center;
    background:#fafafa;
}
.note-editor-toolbar button,
.note-editor-toolbar select{
    height:36px;
    padding:0 10px;
    border:1px solid #d0d7de;
    border-radius:7px;
    background:#fff;
    cursor:pointer;
}
.note-editor-toolbar button:hover{background:#f0f2f4}
.note-editor-body{
    padding:18px;
    overflow:auto;
    flex:1;
}
.note-editor-content{
    min-height:380px;
    border:1px solid #cfd5dc;
    border-radius:9px;
    padding:18px;
    outline:none;
    line-height:1.8;
    text-align:left;
    font-size:16px;
}
.note-editor-content:focus{
    border-color:#7aa7ff;
    box-shadow:0 0 0 2px rgba(50,120,255,.12);
}
.note-editor-foot{
    padding:12px 16px;
    border-top:1px solid #e5e7eb;
    display:flex; justify-content:flex-end; gap:8px;
}
.note-editor-foot button{
    padding:10px 18px;
    border-radius:8px;
    border:1px solid #d0d7de;
    background:#fff;
    cursor:pointer;
}
.note-save{
    background:#1677ff !important;
    color:#fff !important;
    border-color:#1677ff !important;
}
.note-status{margin-right:auto;align-self:center;color:#666;font-size:13px}
@media(max-width:700px){
    .note-edit-button{display:none}
    .note-editor-overlay{display:none}
}

</style>
</head>

<script>

/* ==========================================
   Cloudflare Worker
   ========================================== */

const API_URL =
    "https://seoulbukbu.s01021319376.workers.dev/";


/* ==========================================
   HTML 안전 처리
   ========================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==========================================
   홈
   ========================================== */

function goHome() {

    document.body.classList.remove(
        "topic-mode"
    );

    document.getElementById(
        "topicPage"
    ).style.display = "none";

    document.getElementById(
        "homePage"
    ).style.display = "block";

    window.scrollTo(0,0);
}


/* ==========================================
   주제 열기
   ========================================== */

async function openTopic(topic) {

    document.getElementById(
        "homePage"
    ).style.display = "none";

    document.getElementById(
        "topicPage"
    ).style.display = "block";

    /*
     * 주제 화면으로 들어가면
     * '봉사를 위한 준비' 제목을 숨깁니다.
     */
    document.body.classList.add(
        "topic-mode"
    );

    document.getElementById(
        "topicTitle"
    ).textContent = topic;

    document.getElementById(
        "topicData"
    ).innerHTML = `
        <div class="loading">
            자료를 불러오는 중입니다...
        </div>
    `;

    /*
     * 항상 화면 가장 위로
     */
    window.scrollTo(0,0);

    await loadData(topic);
}


/* ==========================================
   Worker 자료 가져오기
   ========================================== */

async function loadData(topic) {

    const area =
        document.getElementById(
            "topicData"
        );

    try {

        const response =
            await fetch(API_URL, {
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "Worker 응답 오류"
            );
        }


        const data =
            await response.json();


        if (
            !data.success ||
            !Array.isArray(data.records)
        ) {

            throw new Error(
                "자료 형식이 올바르지 않습니다."
            );
        }


        /*
         * 현재 선택한 메뉴만 가져옵니다.
         */

        const records =
            data.records.filter(
                function(record) {

                    const fields =
                        record.fields || {};

                    return (
                        fields["메뉴"] === topic
                    );
                }
            );


        /*
         * Airtable의 '순서'를
         * 정확하게 적용합니다.
         */

        records.sort(
            function(a,b) {

                const aFields =
                    a.fields || {};

                const bFields =
                    b.fields || {};


                const aOrder =
                    Number(
                        aFields["순서"]
                    ) || 999999;


                const bOrder =
                    Number(
                        bFields["순서"]
                    ) || 999999;


                return aOrder - bOrder;
            }
        );


        if (!records.length) {

            area.innerHTML = `
                <div class="empty">
                    아직 준비 중인 자료입니다.
                </div>
            `;

            return;
        }


        renderRecords(records);

    } catch (error) {

        console.error(error);

        area.innerHTML = `
            <div class="error">
                자료를 불러오지 못했습니다.
            </div>
        `;
    }
}


/* ==========================================
   URL 가져오기
   ========================================== */

function getURL(value) {

    if (!value) {
        return "";
    }

    if (
        typeof value === "string"
    ) {
        return value;
    }

    if (
        Array.isArray(value)
    ) {

        if (!value.length) {
            return "";
        }

        if (
            typeof value[0] === "string"
        ) {
            return value[0];
        }

        if (
            value[0] &&
            value[0].url
        ) {
            return value[0].url;
        }
    }

    if (value.url) {
        return value.url;
    }

    return "";
}


/* ==========================================
   성구 WOL 주소
   ========================================== */

function bibleURL(reference) {

    return (
        "https://wol.jw.org/ko/wol/l/r8/lp-ko?q=" +
        encodeURIComponent(
            String(reference).trim()
        )
    );
}


/* ==========================================
   성구 본문 정리
   ========================================== */

function cleanBibleText(text) {

    if (!text) {
        return "";
    }


    let result =
        String(text);


    /*
     * 성경 본문 시작 위치
     */

    const startMarker =
        "신세계역 성경 (연구용)";


    const startIndex =
        result.indexOf(
            startMarker
        );


    if (
        startIndex !== -1
    ) {

        result =
            result.substring(
                startIndex +
                startMarker.length
            );
    }


    /*
     * 성경 본문 뒤의
     * WOL 공통 내용 제거
     */

    const endMarkers = [

        "한국어 워치 타워 출판물",

        "한국어 워치 타워",

        "Copyright",

        "저작권",

        "이용 약관",

        "개인 정보 보호",

        "JW.ORG"

    ];


    let end =
        result.length;


    for (
        const marker of endMarkers
    ) {

        const index =
            result.indexOf(marker);

        if (
            index !== -1 &&
            index < end
        ) {

            end = index;
        }
    }


    result =
        result.substring(
            0,
            end
        );


    /*
     * 불필요한 HTML 엔티티 정리
     */

    result =
        result
            .replace(
                /&copy;/gi,
                ""
            )
            .replace(
                /&amp;/gi,
                "&"
            )
            .replace(
                /&quot;/gi,
                '"'
            )
            .replace(
                /&#39;/gi,
                "'"
            );


    /*
     * 각주 기호 정리
     */

    result =
        result
            .replace(
                /\s+\*/g,
                ""
            )
            .replace(
                /\s+\+/g,
                ""
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    return result;
}


/* ==========================================
   자료 표시
   ========================================== */

function renderRecords(records) {

    const area =
        document.getElementById("topicData");

    let html = "";

    records.forEach(function(record) {

        const fields =
            record.fields || {};

        const type =
            fields["자료명"] || "";

        const title =
            fields["기록명"] ||
            fields["자료명"] ||
            "";

        const bible =
            fields["성구"] || "";

        const link =
            getURL(fields["링크"]);

        const note =
            fields["노트"] || "";

        const imageValue =
            fields["이미지"];

        let imageHTML = "";

        if (Array.isArray(imageValue)) {

            imageValue.forEach(function(file) {

                if (file && file.url) {

                    const fileName =
                        file.filename || "";

                    imageHTML += `
                        <div class="image-box">
                            <a
                                href="${escapeHTML(file.url)}"
                                target="_blank"
                                rel="noopener noreferrer">

                                <img
                                    src="${escapeHTML(file.url)}"
                                    alt="${escapeHTML(fileName)}">

                            </a>

                        </div>
                    `;
                }
            });

        } else {

            const imageURL =
                getURL(imageValue);

            if (imageURL) {

                imageHTML = `
                    <div class="image-box">
                        <a
                            href="${escapeHTML(imageURL)}"
                            target="_blank"
                            rel="noopener noreferrer">

                            <img
                                src="${escapeHTML(imageURL)}"
                                alt="이미지">

                        </a>
                    </div>
                `;
            }
        }


        /* =========================
           링크 자료
           ========================= */

        /*
         * 링크 주소가 있으면 자료명과 관계없이 링크 자료로 표시합니다.
         * 고난[시련]의 기존 링크 자료도 이 조건으로 정상 표시됩니다.
         */
        if (link) {

            html += `
                <div class="data-card">

                    ${
                        title
                        ? `
                        <div style="
                            margin-bottom:12px;
                            font-size:18px;
                            font-weight:700;
                            line-height:1.45;">

                            ${escapeHTML(title)}

                        </div>
                        `
                        : ""
                    }

                    <a
                        class="link-button"
                        href="${escapeHTML(link)}"
                        target="_blank"
                        rel="noopener noreferrer">

                        자료 보기 ↗

                    </a>

                </div>
            `;

            return;
        }


        /* =========================
           성구 자료
           ========================= */

        if (
            type === "성구" &&
            bible
        ) {

            const bibleText =
                cleanBibleText(
                    record.bibleText
                );

            const url =
                record.bibleUrl ||
                bibleURL(bible);


            html += `
                <div class="data-card">

                    <div class="bible-title">
                        ${escapeHTML(bible)}
                    </div>

                    ${
                        bibleText
                        ? `
                        <div class="bible-text">
                            ${escapeHTML(bibleText)}
                        </div>
                        `
                        : `
                        <div style="
                            margin-top:15px;
                            color:#777;
                            font-size:14px;">

                            성구 내용을 불러오지 못했습니다.

                        </div>
                        `
                    }

                    <a
                        class="bible-button"
                        href="${escapeHTML(url)}"
                        target="_blank"
                        rel="noopener noreferrer">

                        성구 보기 ↗

                    </a>

                </div>
            `;

            return;
        }


        /* =========================
           노트 / 이미지
           ========================= */

        if (
            note ||
            imageHTML
        ) {

            html += `
                <div class="data-card">

                    ${
                        title &&
                        type !== "노트" &&
                        type !== "이미지"
                        ? `
                        <div style="
                            margin-bottom:12px;
                            font-size:18px;
                            font-weight:700;
                            line-height:1.45;">

                            ${escapeHTML(title)}

                        </div>
                        `
                        : ""
                    }

                    ${
                        note
                        ? `
                        <div class="note-view">
                            ${renderNoteContent(note)}
                        </div>
                        `
                        : ""
                    }

                    ${imageHTML}

                </div>
            `;

            return;
        }

    });


    if (!html) {

        html = `
            <div class="empty">
                자료 내용이 없습니다.
            </div>
        `;
    }


    area.innerHTML = html;
}



/* ==========================================
   PC 노트 편집기
   - HTML을 Airtable의 노트에 저장
   - 휴대폰에서는 보기 전용
   ========================================== */

let currentNoteRecordId = "";
let currentNoteTitle = "";

function noteCommand(command) {
    document.getElementById("noteEditorContent").focus();
    document.execCommand(command, false, null);
}

function applyNoteSize(size) {
    const editor = document.getElementById("noteEditorContent");
    editor.focus();
    document.execCommand("fontSize", false, "7");
    const fonts = editor.querySelectorAll('font[size="7"]');
    fonts.forEach(el => {
        el.removeAttribute("size");
        el.style.fontSize = size;
    });
}

function openNoteEditor(recordId, title, note) {
    if (window.innerWidth <= 700) return;

    currentNoteRecordId = recordId;
    currentNoteTitle = title || "노트";

    document.getElementById("noteEditorTitle").textContent =
        currentNoteTitle + " - 노트 편집";

    document.getElementById("noteEditorContent").innerHTML =
        noteToEditorHTML(note || "");

    document.getElementById("noteEditorStatus").textContent = "";

    document.getElementById("noteEditorOverlay").style.display = "flex";

    setTimeout(() => {
        document.getElementById("noteEditorContent").focus();
    }, 50);
}

function closeNoteEditor() {
    document.getElementById("noteEditorOverlay").style.display = "none";
    currentNoteRecordId = "";
}

function noteToEditorHTML(value) {
    if (!value) return "";

    /*
     * 우리가 저장한 HTML이면 그대로 복원합니다.
     * 기존 일반 텍스트/Markdown도 최대한 보기 좋게 변환합니다.
     */
    if (/<[a-z][\s\S]*>/i.test(value)) {
        return value;
    }

    let s = escapeHTML(value);

    s = s
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/__(.+?)__/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/_(.+?)_/g, "<em>$1</em>")
        .replace(/\n/g, "<br>");

    return s;
}

function cleanEditorHTML() {
    const editor = document.getElementById("noteEditorContent");
    const clone = editor.cloneNode(true);

    /*
     * 편집기에서 불필요한 이벤트/속성 제거
     */
    clone.querySelectorAll("*").forEach(el => {
        el.removeAttribute("contenteditable");
        el.removeAttribute("id");
        el.removeAttribute("class");

        /*
         * 허용할 기본 스타일만 남깁니다.
         */
        const style = el.getAttribute("style");
        if (style) {
            const temp = document.createElement("div");
            temp.setAttribute("style", style);

            const allowed = [];
            if (el.style.fontSize) {
                allowed.push("font-size:" + el.style.fontSize);
            }
            if (el.style.textAlign) {
                allowed.push("text-align:" + el.style.textAlign);
            }

            if (allowed.length) {
                el.setAttribute("style", allowed.join(";"));
            } else {
                el.removeAttribute("style");
            }
        }
    });

    return clone.innerHTML.trim();
}

async function saveNoteEditor() {

    if (!currentNoteRecordId) return;

    const status =
        document.getElementById("noteEditorStatus");

    const html =
        cleanEditorHTML();

    status.textContent =
        "저장 중...";

    try {

        const response =
            await fetch(API_URL, {

                method: "PATCH",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    recordId:
                        currentNoteRecordId,

                    note:
                        html
                })

            });

        const data =
            await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error ||
                "저장에 실패했습니다."
            );
        }

        status.textContent =
            "저장되었습니다.";

        /*
         * 현재 화면도 즉시 갱신
         */
        const currentTopic =
            document.getElementById("topicTitle").textContent;

        setTimeout(async () => {
            closeNoteEditor();
            await loadData(currentTopic);
        }, 500);

    } catch (error) {

        console.error(error);

        status.textContent =
            "저장 실패: " +
            error.message;
    }
}

function renderNoteContent(note) {

    if (!note) return "";

    /*
     * Airtable에서 저장된 HTML을 안전하게 제한된 태그만
     * 표시합니다.
     */
    let value = String(note);

    /*
     * 기존 Markdown도 간단히 지원
     */
    if (!/<[a-z][\s\S]*>/i.test(value)) {

        value = escapeHTML(value)
            .replace(/\*\*(.+?)\*\*/g,
                "<strong>$1</strong>")
            .replace(/__(.+?)__/g,
                "<strong>$1</strong>")
            .replace(/\*(.+?)\*/g,
                "<em>$1</em>")
            .replace(/_(.+?)_/g,
                "<em>$1</em>")
            .replace(/\n/g, "<br>");

    }

    /*
     * 허용 태그만 남깁니다.
     */
    const template =
        document.createElement("template");

    template.innerHTML = value;

    const allowedTags = new Set([
        "B","STRONG","I","EM","U",
        "BR","P","DIV","SPAN",
        "UL","OL","LI"
    ]);

    template.content
        .querySelectorAll("*")
        .forEach(el => {

            if (!allowedTags.has(el.tagName)) {

                const text =
                    document.createTextNode(
                        el.textContent || ""
                    );

                el.replaceWith(text);

                return;
            }

            /*
             * style은 font-size / text-align만 허용
             */
            const style =
                el.getAttribute("style") || "";

            const safeStyles = [];

            const size =
                style.match(
                    /font-size\s*:\s*([0-9.]+(?:px|pt|em|rem|%))/i
                );

            const align =
                style.match(
                    /text-align\s*:\s*(left|center|right|justify)/i
                );

            if (size) {
                safeStyles.push(
                    "font-size:" + size[1]
                );
            }

            if (align) {
                safeStyles.push(
                    "text-align:" + align[1]
                );
            }

            if (safeStyles.length) {
                el.setAttribute(
                    "style",
                    safeStyles.join(";")
                );
            } else {
                el.removeAttribute("style");
            }

            /*
             * 위험한 속성 제거
             */
            [...el.attributes].forEach(attr => {
                if (
                    attr.name !== "style"
                ) {
                    el.removeAttribute(
                        attr.name
                    );
                }
            });

        });

    return template.innerHTML;
}

</script>

  <div class="note-editor" role="dialog" aria-modal="true">
    <div class="note-editor-head">

      <button type="button" onclick="closeNoteEditor()" aria-label="닫기">✕</button>
    </div>
    <div class="note-editor-toolbar">
      <select id="noteFontSize" onchange="applyNoteSize(this.value)">
        <option value="16px">기본 16</option>
        <option value="14px">작게 14</option>
        <option value="18px">18</option>
        <option value="22px">22</option>
        <option value="28px">28</option>
        <option value="34px">34</option>
      </select>
      <button type="button" onclick="noteCommand('bold')"><b>B</b></button>
      <button type="button" onclick="noteCommand('italic')"><i>I</i></button>
      <button type="button" onclick="noteCommand('underline')"><u>U</u></button>
      <button type="button" onclick="noteCommand('justifyLeft')">왼쪽</button>
      <button type="button" onclick="noteCommand('justifyCenter')">가운데</button>
      <button type="button" onclick="noteCommand('justifyRight')">오른쪽</button>
      <button type="button" onclick="noteCommand('insertUnorderedList')">• 목록</button>
      <button type="button" onclick="noteCommand('insertOrderedList')">1. 목록</button>
      <button type="button" onclick="noteCommand('removeFormat')">서식 지우기</button>
    </div>
    <div class="note-editor-body">
      <div id="noteEditorContent" class="note-editor-content" contenteditable="true"></div>
    </div>
    <div class="note-editor-foot">
      <span id="noteEditorStatus" class="note-status"></span>
      <button type="button" onclick="closeNoteEditor()">취소</button>

    </div>
  </div>
</div>
