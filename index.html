<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>봉사를 위한 준비</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7f6;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
}

.header {
    background: #3f7f4a;
    color: white;
    padding: 18px 20px;
    font-size: 23px;
    font-weight: 700;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 18px 12px 40px;
}

/* 24개 메뉴 */

.menu-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.menu-button {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 62px;
    padding: 8px 4px;

    background: white;
    border: 1px solid #d5ded7;
    border-radius: 12px;

    color: #222;
    font-size: 17px;
    font-weight: 700;

    text-align: center;
    line-height: 1.25;

    text-decoration: none;

    box-shadow: 0 3px 7px rgba(0,0,0,.10);

    cursor: pointer;
}

.menu-button:active {
    transform: scale(.96);
    background: #e8f3e9;
}

/* 주제 */

#topicPage {
    display: none;
}

.home-button {
    display: inline-block;

    margin-bottom: 18px;
    padding: 10px 15px;

    background: white;
    border: 1px solid #d5ded7;
    border-radius: 9px;

    color: #28733a;
    font-size: 15px;
    font-weight: 700;

    text-decoration: none;
}

.topic-title {
    margin-bottom: 18px;

    font-size: 27px;
    font-weight: 700;
}

/* 자료 카드 */

.data-card {
    background: white;
    border-radius: 14px;

    padding: 18px;
    margin-bottom: 15px;

    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.section-title {
    margin: 22px 4px 12px;

    color: #28733a;

    font-size: 19px;
    font-weight: 700;
}

/* 성구 */

.bible-title {
    display: block;

    color: #2f7040;

    font-size: 20px;
    font-weight: 700;

    text-decoration: none;
}

.bible-title::after {
    content: " ↗";
    font-size: 16px;
}

.bible-button {
    display: block;

    margin-top: 15px;
    padding: 14px;

    background: #3f7f4a;
    border-radius: 10px;

    color: white;

    text-align: center;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;
}

/* 링크 */

.link-button {
    display: block;

    width: 100%;

    padding: 14px;

    background: #3f7f4a;
    border-radius: 10px;

    color: white;

    text-align: center;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;
}

/* 이미지 */

.image-box img {
    display: block;

    width: 100%;
    height: auto;

    border-radius: 12px;
}

/* 로딩 */

.loading,
.empty,
.error {
    padding: 25px 18px;

    background: white;
    border-radius: 14px;

    text-align: center;

    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.loading {
    color: #666;
}

.empty {
    color: #777;
}

.error {
    color: #b33;
}

@media (max-width: 480px) {

    .header {
        font-size: 21px;
    }

    .menu-grid {
        gap: 8px;
    }

    .menu-button {
        min-height: 58px;
        font-size: 15px;
    }

    .topic-title {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="header">
    봉사를 위한 준비
</div>

<main class="container">

<!-- =========================
     홈
     ========================= -->

<section id="homePage">

<div class="menu-grid">

<a class="menu-button"
   href="#"
   onclick="openTopic('대화[칭찬]');return false;">
   대화[칭찬]
</a>

<a class="menu-button"

   고난[시련]
</a>

<a class="menu-button"
   href="#"

<a class="menu-button"

</a>

<a class="menu-button"

   전파[전도]
</a>

<a class="menu-button"
   href="#"

</a>

<a class="menu-button"
   href="#"

</a>

<a class="menu-button"
   href="#"
   onclick="openTopic('죽음[사망]');return false;">

</a>

<a class="menu-button"
   href="#"
   onclick="openTopic('부 활');return false;">
   부 활
</a>

<a class="menu-button"
   href="#"
   onclick="openTopic('지 옥');return false;">
   지 옥
</a>

<a class="menu-button"
   href="#"
   onclick="openTopic('천국[천당]');return false;">
   천국[천당]
</a>

<a class="menu-button"
   href="#"
   onclick="openTopic('왕 국');return false;">
   왕 국
</a>

<a class="menu-button"
   href="#"
   onclick="openTopic('정치[중립]');return false;">
   정치[중립]
</a>

<a class="menu-button"
   href="#"
   onclick="openTopic('전 쟁');return false;">

</a>

<a class="menu-button"

<a class="menu-button"

<a class="menu-button"

<a class="menu-button"
   href="#"
   onclick="openTopic('편지봉사');return false;">
   편지봉사
</a>

</div>
</section>


<!-- =========================
     자료 화면
     ========================= -->

<section id="topicPage">

<a href="#"
   class="home-button"
   onclick="goHome();return false;">
   ← 홈으로 돌아가기
</a>

<div id="topicTitle"
     class="topic-title">
</div>

<div id="topicData">
</div>

</section>

</main>


<script>

/* ==================================================
   고난[시련] 테스트 버전
   - Cloudflare Worker 사용 안 함
   - Airtable API 토큰 사용 안 함
   - 우선 화면/링크 작동을 확인하기 위한 테스트 자료
   ================================================== */

const testData = {
    "고난[시련]": [
        { 기록명:"고난[전도지]", 자료명:"링크", 성구:"", 링크:"https://wol.jw.org/ko/wol/d/r8/lp-ko/1102013410" },
        { 기록명:"우리가 겪는 고난에 대한 책임이 하느님에게 있습니까? [성경 질문과 대답]", 자료명:"링크", 성구:"", 링크:"https://wol.jw.org/ko/wol/d/r8/lp-ko/502012504" },
        { 기록명:"", 자료명:"성구", 성구:"요한1서 5:19", 링크:"" },
        { 기록명:"", 자료명:"성구", 성구:"요한1서 3:8", 링크:"" },
        { 기록명:"", 자료명:"성구", 성구:"로마서 5:12", 링크:"" },
        { 기록명:"", 자료명:"성구", 성구:"로마서 3:23", 링크:"" },
        { 기록명:"", 자료명:"성구", 성구:"전도서 9:11", 링크:"" },
        { 기록명:"", 자료명:"성구", 성구:"야고보서 1:13-15", 링크:"" },
        { 기록명:"", 자료명:"성구", 성구:"창세기 2:17", 링크:"" },
        { 기록명:"지배[전도지]", 자료명:"링크", 성구:"", 링크:"https://wol.jw.org/ko/wol/d/r8/lp-ko/1102013400" },
        { 기록명:"이토록 고난이 많은 이유가 무엇입니까? [깨 11/7]", 자료명:"링크", 성구:"", 링크:"https://wol.jw.org/ko/wol/d/r8/lp-ko/102011242" }
    ]
};

function escapeHTML(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function goHome() {
    document.getElementById("topicPage").style.display = "none";
    document.getElementById("homePage").style.display = "block";
    window.scrollTo(0,0);
}

async function openTopic(topic) {
    document.getElementById("homePage").style.display = "none";
    document.getElementById("topicPage").style.display = "block";
    document.getElementById("topicTitle").textContent = topic;
    document.getElementById("topicData").innerHTML =
        `<div class="loading">자료를 불러오는 중입니다...</div>`;
    window.scrollTo(0,0);
    await loadData(topic);
}

async function loadData(topic) {
    const area = document.getElementById("topicData");
    const records = testData[topic] || [];

    if (!records.length) {
        area.innerHTML = `<div class="empty">등록된 자료가 없습니다.</div>`;
        return;
    }

    renderRecords(records);
}

function bibleURL(reference) {
    return "https://wol.jw.org/ko/wol/l/r8/lp-ko?q=" +
           encodeURIComponent(reference);
}

function renderRecords(records) {
    const area = document.getElementById("topicData");
    let links = "";
    let bibles = "";

    records.forEach(function(record) {
        const typeName = record.자료명 || "";
        const title = record.기록명 || "";
        const bible = record.성구 || "";
        const link = record.링크 || "";

        if (typeName === "링크" && link) {
            links += `
                <div class="data-card">
                    ${title ? `<div style="margin-bottom:12px;font-size:18px;font-weight:700;line-height:1.45;">
                        ${escapeHTML(title)}
                    </div>` : ""}
                    <a class="link-button"
                       href="${escapeHTML(link)}"
                       target="_blank"
                       rel="noopener noreferrer">
                       자료 보기 ↗
                    </a>
                </div>`;
        }

        if (typeName === "성구" && bible) {
            const url = link || bibleURL(bible);
            bibles += `
                <div class="data-card">
                    <a class="bible-title"
                       href="${escapeHTML(url)}"
                       target="_blank"
                       rel="noopener noreferrer">
                       ${escapeHTML(bible)}
                    </a>
                    <a class="bible-button"
                       href="${escapeHTML(url)}"
                       target="_blank"
                       rel="noopener noreferrer">
                       성구 보기 ↗
                    </a>
                </div>`;
        }
    });

    let html = "";

    if (links) {
        html += `<div class="section-title">🔗 링크</div>${links}`;
    }

    if (bibles) {
        html += `<div class="section-title">📖 성구</div>${bibles}`;
    }

    area.innerHTML = html ||
        `<div class="empty">자료 내용이 없습니다.</div>`;
}

</script>

</body>
</html>
